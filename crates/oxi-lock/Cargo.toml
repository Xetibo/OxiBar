[package]
name = "oxi-lock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Protocol-owned Wayland session locker"

[dependencies]
iced = { version = "0.14", features = ["advanced", "image", "svg"] }
iced_runtime = "0.14"
iced_tiny_skia = { version = "0.14", features = ["image", "svg"] }
libc = "0.2"
memmap2 = "0.9"
oxi-auth-ui = { path = "../oxi-auth-ui" }
oxi-pam = { path = "../oxi-pam" }
oxiced = { workspace = true }
rustix = { version = "1", features = ["event", "fs"] }
tiny-skia = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
waycrate_xkbkeycode = "0.17.1"
zbus = "5.14"

[dev-dependencies]
zbus = { version = "5.14", features = ["p2p"] }
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }

[[bin]]
name = "oxilock"
path = "src/main.rs"

[[bin]]
name = "oxilock-sleep"
path = "src/sleep_main.rs"
