[package]
name = "oxibar"
version = "0.1.0"
edition = "2024"
description = "A simple application runner made with Iced"
license = "GPL-3.0-only"

[dependencies]
iced = { version = "0.14.0", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
]}
iced_layershell = "0.17.1"
oxilib = { git = "https://github.com/Xetibo/OxiLib" }
oxiced = { git = "https://github.com/Xetibo/oxiced", branch="iced14" }
xdg = "3.0.0"
fuzzy-matcher = "0.3.7"
toml = "0.9.8"
serde = "1.0.219"
optional_struct = "0.5.2"
libloading = "0.8.9"
once_cell = "1.21.3"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
hyprland = "0.4.0-beta.3"
iced_anim = "0.3.1"
