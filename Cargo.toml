[workspace]
resolver = "2"
members = [
	".",
	"crates/oxibar-plugin-api",
	"crates/oxiced",
	"plugins/audio",
	"plugins/applications",
	"plugins/battery",
	"plugins/bluetooth",
	"plugins/clock",
	"plugins/network",
	"plugins/notifications",
	"plugins/tray",
	"plugins/workspaces",
]

[workspace.dependencies]
oxiced = { path = "crates/oxiced" }

[package]
name = "oxibar"
version = "0.1.0"
edition = "2024"
description = "Wayland status bar built on iced + wlr-layershell"
license = "GPL-3.0-only"

[dependencies]
oxibar-plugin-api = { path = "crates/oxibar-plugin-api" }
iced = { version = "0.14.0", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
]}
iced_layershell = "0.17.1"
iced_runtime = "0.14.0"
hyprland = "0.4.0-beta.3"
iced_anim = "0.3.1"
oxiced = { workspace = true }
xdg = "3.0.0"
toml = "0.9.8"
libloading = "0.8.9"
once_cell = "1.21.3"
rustix = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
notify = "8.2"
serde_json = "1"
shell-words = "1.1"
