[workspace]
resolver = "2"
members = [
	".",
	"crates/oxibar-plugin-api",
	"plugins/audio",
	"plugins/bluetooth",
	"plugins/clock",
	"plugins/network",
	"plugins/notifications",
	"plugins/tray",
	"plugins/workspaces",
]

[package]
name = "oxibar"
version = "0.1.0"
edition = "2024"
description = "Wayland status bar built on iced + wlr-layershell"
license = "GPL-3.0-only"

[dependencies]
oxibar-plugin-api = { path = "crates/oxibar-plugin-api" }
iced = { version = "0.14.0", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
]}
iced_layershell = "0.17.1"
iced_runtime = "0.14.0"
iced_anim = "0.3.1"
oxiced = { git = "https://github.com/Xetibo/oxiced", branch="iced14" }
xdg = "3.0.0"
toml = "0.9.8"
libloading = "0.8.9"
once_cell = "1.21.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

