[workspace]
resolver = "2"
exclude = ["crates/layershellev"]
members = [
	".",
	"crates/oxibar-plugin-api",
	"crates/oxiced",
	"crates/oxi-auth-ui",
	"crates/oxi-lock",
	"crates/oxi-pam",
	"crates/oxi-session",
	"plugins/audio",
	"plugins/applications",
	"plugins/battery",
	"plugins/bluetooth",
	"plugins/clock",
	"plugins/network",
	"plugins/notifications",
	"plugins/oxipaste",
	"plugins/system",
    "plugins/stats",
    "plugins/tools",
    "plugins/example",
	"plugins/tray",
	"plugins/workspaces",
]

[workspace.dependencies]
oxiced = { path = "crates/oxiced" }

[patch.crates-io]
layershellev = { path = "crates/layershellev" }

[package]
name = "oxibar"
version = "0.1.0"
edition = "2024"
description = "Wayland status bar built on iced + wlr-layershell"
license = "GPL-3.0-only"

[dependencies]
oxibar-plugin-api = { path = "crates/oxibar-plugin-api" }
iced = { version = "0.14.0", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
]}
iced_layershell = "0.17.1"
iced_runtime = "0.14.0"
hyprland = "0.4.0-beta.3"
iced_anim = "0.3.1"
oxiced = { workspace = true }
xdg = "3.0.0"
toml = "0.9.8"
libloading = "0.8.9"
once_cell = "1.21.3"
rustix = { version = "1", features = ["event", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-scanner = "0.31"
memmap2 = "0.9"
bitflags = "2"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
notify = "8.2"
serde_json = "1"
shell-words = "1.1"

[dev-dependencies]
async-io = "2"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
