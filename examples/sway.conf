# Import the compositor session environment before starting the opt-in user service.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP
exec systemctl --user start oxibar.service
bindsym $mod+space exec oxibar launcher toggle
bindsym $mod+Escape exec oxibar session toggle
bindsym $mod+comma exec oxibar settings open
bindsym $mod+n exec oxibar control-center toggle
bindsym XF86AudioRaiseVolume exec oxibar action Audio volume +5
bindsym XF86AudioLowerVolume exec oxibar action Audio volume -5
bindsym XF86AudioMute exec oxibar action Audio mute toggle
bindsym XF86MonBrightnessUp exec oxibar action System brightness +5
bindsym XF86MonBrightnessDown exec oxibar action System brightness -5
