[package]
name = "system"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
oxibar-plugin-api = { path = "../../crates/oxibar-plugin-api" }
oxiced = { workspace = true }
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
async-io = "2"
zbus = "5.14.0"
notify = "8.2"
rustix = { version = "1", features = ["process", "fs"] }
shell-words = "1.1"

[dev-dependencies]
iced_runtime = "0.14"
