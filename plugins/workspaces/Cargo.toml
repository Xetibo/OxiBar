[package]
name = "workspaces"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
iced = { version = "0.14.0", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
]}
iced_layershell = "0.17.1"
oxilib = { git = "https://github.com/Xetibo/OxiLib" }
oxiced = { git = "https://github.com/Xetibo/oxiced", branch="iced14" }
xdg = "3.0.0"
fuzzy-matcher = "0.3.7"
toml = "0.9.8"
serde = "1.0.219"
optional_struct = "0.5.2"
hyprland = "0.4.0-beta.3"
iced_anim = "0.3.1"
tokio = { version = "1", features = ["rt"] }
