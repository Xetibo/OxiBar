[package]
name = "oxipaste"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
oxibar-plugin-api = { path = "../../crates/oxibar-plugin-api" }
oxiced = { workspace = true }
iced = { version = "0.14.0", features = ["advanced", "image", "tokio"] }
async-io = "2"
rustix = { version = "1", features = ["fs", "event", "pipe"] }
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
iced_runtime = "0.14"
